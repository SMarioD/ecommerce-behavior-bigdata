services:
  # Mediul de lucru: PySpark + JupyterLab. Tot proiectul e montat în /workspace.
  spark:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ecommerce-bigdata:latest
    container_name: bd-spark
    volumes:
      - ./:/workspace
    ports:
      - "127.0.0.1:8888:8888"   # JupyterLab, doar local
      - "127.0.0.1:4040:4040"   # Spark UI, doar local (cât timp rulează un job)
    environment:
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-10g}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-bigdata}
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --notebook-dir=/workspace
